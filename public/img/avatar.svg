<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c23b2e"/>
      <stop offset="60%" stop-color="#94261f"/>
      <stop offset="100%" stop-color="#5e1512"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0b184"/>
      <stop offset="100%" stop-color="#b98458"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#000" opacity="0.12"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>

  <!-- Sol / halo -->
  <circle cx="300" cy="250" r="190" fill="#e0392f" opacity="0.25"/>
  <circle cx="300" cy="250" r="150" fill="#e0392f" opacity="0.18"/>

  <!-- Hombrera / hoodie -->
  <path d="M120 600 q10 -130 100 -176 q80 -40 160 0 q90 46 100 176 z" fill="#161719"/>
  <path d="M210 440 q90 -40 180 0 l-16 34 q-74 -30 -148 0 z" fill="#0e0f10"/>

  <!-- Cuello -->
  <rect x="270" y="392" width="60" height="64" fill="#b98458"/>
  <rect x="270" y="392" width="60" height="14" fill="#9c6a44"/>

  <!-- Orejas -->
  <rect x="198" y="268" width="18" height="54" rx="8" fill="#c9955f"/>
  <rect x="384" y="268" width="18" height="54" rx="8" fill="#c9955f"/>

  <!-- Cara -->
  <rect x="206" y="156" width="188" height="250" rx="62" fill="url(#skin)"/>
  <rect x="206" y="330" width="188" height="76" rx="30" fill="#c9955f" opacity="0.35"/>

  <!-- Pelo -->
  <path d="M200 220 q0 -90 100 -90 q100 0 100 90 l-10 21 q-8 -48 -90 -48 q-80 0 -90 48 z" fill="#171311"/>
  <path d="M200 220 q10 -74 100 -74 q90 0 100 74 l-14 -16 q-20 -34 -86 -34 q-64 0 -86 34 z" fill="#241b16"/>
  <rect x="206" y="206" width="30" height="26" fill="#171311"/>
  <rect x="364" y="206" width="30" height="26" fill="#171311"/>

  <!-- Cejas -->
  <rect x="234" y="258" width="48" height="8" rx="4" fill="#241b16"/>
  <rect x="318" y="258" width="48" height="8" rx="4" fill="#241b16"/>

  <!-- Gafas -->
  <g>
    <rect x="226" y="276" width="66" height="48" rx="12" fill="#8fb8b3" opacity="0.24"/>
    <rect x="308" y="276" width="66" height="48" rx="12" fill="#8fb8b3" opacity="0.24"/>
    <rect x="226" y="276" width="66" height="48" rx="12" fill="none" stroke="#121314" stroke-width="6"/>
    <rect x="308" y="276" width="66" height="48" rx="12" fill="none" stroke="#121314" stroke-width="6"/>
    <rect x="292" y="292" width="16" height="6" fill="#121314"/>
    <rect x="374" y="292" width="18" height="6" fill="#121314"/>
    <rect x="208" y="292" width="18" height="6" fill="#121314"/>
    <rect x="238" y="288" width="14" height="8" fill="#fff" opacity="0.35"/>
    <rect x="320" y="288" width="14" height="8" fill="#fff" opacity="0.35"/>
  </g>

  <!-- Ojos -->
  <rect x="246" y="294" width="16" height="12" fill="#1a1410"/>
  <rect x="330" y="294" width="16" height="12" fill="#1a1410"/>

  <!-- Nariz -->
  <path d="M300 300 l-10 44 l20 0 z" fill="#b98458" opacity="0.55"/>

  <!-- Boca -->
  <rect x="268" y="360" width="64" height="7" rx="3" fill="#7e3d33"/>
  <rect x="276" y="367" width="48" height="5" rx="2" fill="#5e2a24"/>

  <!-- Barba suave -->
  <path d="M212 340 q0 66 88 66 q88 0 88 -66 l-8 34 q-16 44 -80 44 q-64 0 -80 -44 z" fill="#3a2a1f" opacity="0.35"/>

  <!-- Auriculares -->
  <path d="M202 300 q0 -120 98 -120 q98 0 98 120" fill="none" stroke="#0d0e0f" stroke-width="18"/>
  <rect x="186" y="286" width="34" height="70" rx="12" fill="#1c1d1f"/>
  <rect x="380" y="286" width="34" height="70" rx="12" fill="#1c1d1f"/>
  <rect x="190" y="300" width="26" height="40" rx="10" fill="#e0392f"/>
  <rect x="384" y="300" width="26" height="40" rx="10" fill="#e0392f"/>

  <!-- Cordones -->
  <path d="M264 448 l-8 70" stroke="#efe2c8" stroke-width="6" stroke-linecap="round"/>
  <path d="M336 448 l8 70" stroke="#efe2c8" stroke-width="6" stroke-linecap="round"/>
  <rect x="248" y="512" width="10" height="16" fill="#efe2c8"/>
  <rect x="342" y="512" width="10" height="16" fill="#efe2c8"/>

  <!-- Reflejo rojo lateral -->
  <rect x="0" y="0" width="600" height="600" fill="url(#scan)"/>
  <rect width="600" height="600" fill="#000" opacity="0.05"/>
</svg>
