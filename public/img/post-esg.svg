<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241312"/>
      <stop offset="45%" stop-color="#6d241d"/>
      <stop offset="75%" stop-color="#a83a2b"/>
      <stop offset="100%" stop-color="#1e2a20"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24352a"/>
      <stop offset="100%" stop-color="#101811"/>
    </linearGradient>
    <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f07054"/>
      <stop offset="100%" stop-color="#c03328"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <rect x="1" y="1" width="1" height="1" fill="#fff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#sky)"/>

  <!-- Sol -->
  <circle cx="840" cy="330" r="150" fill="#d94336" opacity="0.14"/>
  <circle cx="840" cy="330" r="100" fill="url(#sunG)"/>
  <g fill="#8f211b" opacity="0.3">
    <rect x="750" y="322" width="180" height="4"/>
    <rect x="762" y="344" width="156" height="4"/>
    <rect x="786" y="366" width="108" height="4"/>
  </g>

  <!-- Nubes -->
  <g fill="#e8c6a8" opacity="0.18">
    <rect x="180" y="180" width="260" height="7"/>
    <rect x="240" y="198" width="160" height="5"/>
    <rect x="520" y="120" width="200" height="6"/>
  </g>

  <!-- Colinas -->
  <path d="M0 560 Q 180 470 360 540 T 720 520 T 1080 560 T 1200 530 V750 H0 Z" fill="url(#hill)"/>

  <!-- Ciudad -->
  <g fill="#101a13">
    <rect x="60" y="470" width="80" height="280"/>
    <rect x="150" y="420" width="60" height="330"/>
    <rect x="220" y="500" width="90" height="250"/>
    <rect x="920" y="480" width="70" height="270"/>
    <rect x="1000" y="430" width="60" height="320"/>
    <rect x="1070" y="500" width="90" height="250"/>
  </g>
  <g fill="#e0a75e" opacity="0.55">
    <rect x="76" y="490" width="10" height="14"/><rect x="100" y="520" width="10" height="14"/>
    <rect x="164" y="444" width="8" height="12"/><rect x="180" y="470" width="8" height="12"/>
    <rect x="238" y="520" width="10" height="14"/><rect x="266" y="550" width="10" height="14"/>
    <rect x="936" y="500" width="10" height="14"/><rect x="1014" y="450" width="8" height="12"/>
    <rect x="1088" y="520" width="10" height="14"/>
  </g>

  <!-- Aerogeneradores -->
  <g stroke="#0d150f" fill="#0d150f">
    <!-- 1 -->
    <rect x="418" y="300" width="10" height="300"/>
    <circle cx="423" cy="300" r="10"/>
    <g stroke-width="8" stroke-linecap="square">
      <line x1="423" y1="300" x2="423" y2="200"/>
      <line x1="423" y1="300" x2="510" y2="350"/>
      <line x1="423" y1="300" x2="336" y2="350"/>
    </g>
    <!-- 2 -->
    <rect x="638" y="360" width="8" height="240"/>
    <circle cx="642" cy="360" r="8"/>
    <g stroke-width="6">
      <line x1="642" y1="360" x2="642" y2="280"/>
      <line x1="642" y1="360" x2="708" y2="398"/>
      <line x1="642" y1="360" x2="576" y2="398"/>
    </g>
    <!-- 3 -->
    <rect x="898" y="250" width="10" height="350"/>
    <circle cx="903" cy="250" r="10"/>
    <g stroke-width="8">
      <line x1="903" y1="250" x2="903" y2="150"/>
      <line x1="903" y1="250" x2="990" y2="300"/>
      <line x1="903" y1="250" x2="816" y2="300"/>
    </g>
  </g>

  <!-- Árboles -->
  <g fill="#16241a">
    <path d="M120 690 l40 -110 l40 110 z"/>
    <path d="M160 700 l30 -80 l30 80 z"/>
    <path d="M520 700 l44 -120 l44 120 z"/>
    <path d="M560 706 l28 -76 l28 76 z"/>
    <path d="M960 700 l40 -110 l40 110 z"/>
    <path d="M1000 708 l26 -72 l26 72 z"/>
  </g>
  <g fill="#26382a">
    <path d="M140 686 l20 -56 l20 56 z"/>
    <path d="M540 694 l22 -62 l22 62 z"/>
    <path d="M980 696 l20 -56 l20 56 z"/>
  </g>

  <!-- Sendero -->
  <path d="M560 750 Q 620 640 700 590 Q 760 550 760 530 L 800 530 Q 790 570 720 620 Q 650 670 620 750 Z" fill="#c9bda6" opacity="0.22"/>

  <!-- Pájaros -->
  <g stroke="#0d150f" stroke-width="3" fill="none" opacity="0.8">
    <path d="M300 250 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M360 280 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M500 210 q10 -10 20 0 q10 -10 20 0"/>
  </g>

  <rect width="1200" height="750" fill="url(#grain)"/>
  <rect width="1200" height="750" fill="#000" opacity="0.05"/>
</svg>
