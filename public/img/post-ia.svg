<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101619"/>
      <stop offset="100%" stop-color="#080b0c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16322d"/>
      <stop offset="100%" stop-color="#0b1a18"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#5e8a84" stroke-width="1" opacity="0.18"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#room)"/>

  <!-- Persiana -->
  <g stroke="#1e2b2d" stroke-width="8" opacity="0.8">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
  </g>
  <rect x="880" y="40" width="260" height="120" fill="#d94336" opacity="0.08"/>
  <rect x="900" y="52" width="220" height="96" fill="#e0392f" opacity="0.12"/>

  <!-- Escritorio -->
  <rect x="0" y="620" width="1200" height="130" fill="#0a0d0e"/>
  <rect x="0" y="618" width="1200" height="5" fill="#2b3a3a"/>

  <!-- Monitor izquierdo -->
  <g>
    <rect x="70" y="230" width="340" height="260" fill="#0b1214" stroke="#2e4444" stroke-width="3"/>
    <rect x="90" y="250" width="300" height="210" fill="url(#screen)"/>
    <rect x="90" y="250" width="300" height="210" fill="url(#grid)"/>
    <rect x="90" y="250" width="300" height="210" fill="url(#scan)"/>
    <g fill="#5e8a84" opacity="0.8">
      <rect x="108" y="390" width="16" height="50"/>
      <rect x="134" y="366" width="16" height="74"/>
      <rect x="160" y="378" width="16" height="62"/>
      <rect x="186" y="338" width="16" height="102"/>
      <rect x="212" y="354" width="16" height="86"/>
      <rect x="238" y="312" width="16" height="128"/>
    </g>
    <g fill="#e0392f" opacity="0.9">
      <rect x="276" y="286" width="92" height="6"/>
      <rect x="276" y="306" width="64" height="6"/>
      <rect x="276" y="326" width="80" height="6"/>
    </g>
    <line x1="108" y1="440" x2="372" y2="440" stroke="#e0392f" stroke-width="2" opacity="0.7"/>
    <rect x="210" y="490" width="60" height="40" fill="#0d1517"/>
    <rect x="160" y="528" width="160" height="10" fill="#1c2a2b"/>
  </g>

  <!-- Monitor derecho -->
  <g>
    <rect x="470" y="300" width="250" height="190" fill="#0b1214" stroke="#2e4444" stroke-width="3"/>
    <rect x="488" y="318" width="214" height="148" fill="url(#screen)"/>
    <rect x="488" y="318" width="214" height="148" fill="url(#grid)"/>
    <g fill="#e0392f" opacity="0.85">
      <rect x="508" y="340" width="70" height="5"/>
      <rect x="508" y="356" width="110" height="5"/>
      <rect x="508" y="372" width="88" height="5"/>
    </g>
    <g fill="#5e8a84" opacity="0.7">
      <rect x="508" y="400" width="52" height="42"/>
      <rect x="574" y="386" width="52" height="56"/>
      <rect x="640" y="414" width="42" height="28"/>
    </g>
  </g>

  <!-- Cables -->
  <g fill="none" stroke="#1b2729" stroke-width="5">
    <path d="M410 560 C 450 600, 500 600, 540 640"/>
    <path d="M600 560 C 640 610, 700 620, 740 660"/>
    <path d="M240 470 C 260 560, 300 600, 340 660"/>
  </g>

  <!-- Robot -->
  <g>
    <ellipse cx="880" cy="690" rx="150" ry="18" fill="#000" opacity="0.55"/>

    <!-- Cuerpo -->
    <path d="M760 520 q120 -50 240 0 l32 190 h-304 z" fill="#182325"/>
    <path d="M780 540 q100 -34 200 0" fill="none" stroke="#2d4142" stroke-width="5"/>

    <!-- Cuello -->
    <rect x="850" y="470" width="60" height="50" fill="#223032"/>
    <g fill="#e0392f" opacity="0.9">
      <rect x="862" y="482" width="36" height="5"/>
      <rect x="862" y="496" width="22" height="5"/>
    </g>

    <!-- Cabeza -->
    <rect x="790" y="300" width="180" height="180" rx="18" fill="#26383a" stroke="#0b1112" stroke-width="6"/>
    <rect x="806" y="316" width="148" height="130" rx="10" fill="#101719"/>
    <rect x="806" y="316" width="148" height="130" rx="10" fill="url(#scan)"/>

    <!-- Ojos -->
    <rect x="826" y="350" width="44" height="30" rx="6" fill="#e0392f"/>
    <rect x="890" y="350" width="44" height="30" rx="6" fill="#e0392f"/>
    <rect x="838" y="360" width="20" height="10" fill="#ffd0a0" opacity="0.9"/>
    <rect x="902" y="360" width="20" height="10" fill="#ffd0a0" opacity="0.9"/>

    <!-- Boca -->
    <g fill="#5e8a84">
      <rect x="836" y="408" width="10" height="14"/>
      <rect x="854" y="408" width="10" height="14"/>
      <rect x="872" y="408" width="10" height="14"/>
      <rect x="890" y="408" width="10" height="14"/>
      <rect x="908" y="408" width="10" height="14"/>
    </g>

    <!-- Antena -->
    <line x1="880" y1="300" x2="880" y2="260" stroke="#2d4142" stroke-width="6"/>
    <circle cx="880" cy="252" r="12" fill="#e0392f"/>
    <circle cx="880" cy="252" r="30" fill="#e0392f" opacity="0.12"/>

    <!-- Orejas -->
    <rect x="770" y="356" width="20" height="56" fill="#1c2a2b"/>
    <rect x="970" y="356" width="20" height="56" fill="#1c2a2b"/>
  </g>

  <!-- Taza -->
  <g>
    <rect x="660" y="640" width="56" height="52" rx="6" fill="#efe2c8"/>
    <rect x="660" y="636" width="56" height="8" fill="#c9bda6"/>
    <path d="M716 652 q22 0 22 16 t-22 16" fill="none" stroke="#efe2c8" stroke-width="7"/>
    <rect x="670" y="656" width="36" height="6" fill="#e0392f" opacity="0.8"/>
  </g>

  <rect width="1200" height="750" fill="#000" opacity="0.06"/>
</svg>
