<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1417"/>
      <stop offset="55%" stop-color="#152427"/>
      <stop offset="100%" stop-color="#0b0f10"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f05a45"/>
      <stop offset="100%" stop-color="#b52c24"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2629"/>
      <stop offset="100%" stop-color="#070a0b"/>
    </linearGradient>
    <pattern id="rain" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M18 0 L10 26" stroke="#8fb8b3" stroke-width="1" opacity="0.14"/>
    </pattern>
    <pattern id="win" width="22" height="26" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="7" height="10" fill="#e0a75e" opacity="0.75"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#sky)"/>
  <rect width="1200" height="750" fill="url(#rain)"/>

  <!-- Sol -->
  <circle cx="880" cy="250" r="160" fill="#d94336" opacity="0.12"/>
  <circle cx="880" cy="250" r="112" fill="url(#sun)"/>
  <g fill="#8f211b" opacity="0.4">
    <rect x="775" y="240" width="210" height="4"/>
    <rect x="790" y="266" width="180" height="4"/>
    <rect x="815" y="292" width="130" height="4"/>
  </g>

  <!-- Cuadrícula de fondo -->
  <g stroke="#2b4a4a" stroke-width="1" opacity="0.25">
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="575" x2="1200" y2="575"/>
    <line x1="0" y1="635" x2="1200" y2="635"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
  </g>

  <!-- Rascacielos -->
  <g>
    <rect x="40" y="260" width="120" height="490" fill="#10191c"/>
    <rect x="160" y="330" width="90" height="420" fill="#0c1315"/>
    <rect x="250" y="180" width="140" height="570" fill="#132023"/>
    <rect x="390" y="300" width="100" height="450" fill="#0e1719"/>
    <rect x="490" y="230" width="120" height="520" fill="#101c1f"/>
    <rect x="610" y="350" width="90" height="400" fill="#0b1214"/>
    <rect x="700" y="200" width="130" height="550" fill="#122022"/>
    <rect x="830" y="330" width="100" height="420" fill="#0d1517"/>
    <rect x="930" y="250" width="120" height="500" fill="#111d20"/>
    <rect x="1050" y="320" width="110" height="430" fill="#0c1315"/>
  </g>

  <!-- Ventanas -->
  <g opacity="0.85">
    <rect x="58" y="286" width="84" height="430" fill="url(#win)"/>
    <rect x="268" y="206" width="104" height="500" fill="url(#win)"/>
    <rect x="508" y="256" width="84" height="450" fill="url(#win)"/>
    <rect x="718" y="226" width="94" height="480" fill="url(#win)"/>
    <rect x="948" y="276" width="84" height="430" fill="url(#win)"/>
  </g>

  <!-- Gráfico de velas -->
  <g>
    <line x1="120" y1="470" x2="1080" y2="470" stroke="#e0392f" stroke-width="2" opacity="0.5"/>
    <g stroke-width="3">
      <line x1="180" y1="420" x2="180" y2="520" stroke="#5e8a84"/><rect x="170" y="440" width="20" height="52" fill="#5e8a84"/>
      <line x1="250" y1="392" x2="250" y2="488" stroke="#d94336"/><rect x="240" y="410" width="20" height="58" fill="#d94336"/>
      <line x1="320" y1="360" x2="320" y2="452" stroke="#5e8a84"/><rect x="310" y="380" width="20" height="50" fill="#5e8a84"/>
      <line x1="390" y1="330" x2="390" y2="430" stroke="#d94336"/><rect x="380" y="352" width="20" height="60" fill="#d94336"/>
      <line x1="460" y1="300" x2="460" y2="410" stroke="#5e8a84"/><rect x="450" y="330" width="20" height="54" fill="#5e8a84"/>
      <line x1="530" y1="280" x2="530" y2="385" stroke="#d94336"/><rect x="520" y="305" width="20" height="62" fill="#d94336"/>
      <line x1="600" y1="310" x2="600" y2="410" stroke="#5e8a84"/><rect x="590" y="330" width="20" height="52" fill="#5e8a84"/>
      <line x1="670" y1="270" x2="670" y2="370" stroke="#d94336"/><rect x="660" y="290" width="20" height="58" fill="#d94336"/>
      <line x1="740" y1="240" x2="740" y2="345" stroke="#5e8a84"/><rect x="730" y="266" width="20" height="56" fill="#5e8a84"/>
      <line x1="810" y1="210" x2="810" y2="320" stroke="#d94336"/><rect x="800" y="238" width="20" height="62" fill="#d94336"/>
      <line x1="880" y1="230" x2="880" y2="340" stroke="#5e8a84"/><rect x="870" y="256" width="20" height="58" fill="#5e8a84"/>
    </g>
  </g>

  <!-- Calle -->
  <polygon points="0,750 1200,750 880,520 320,520" fill="url(#road)"/>
  <g stroke="#2a3c3c" stroke-width="2" opacity="0.5">
    <line x1="320" y1="520" x2="0" y2="750"/>
    <line x1="880" y1="520" x2="1200" y2="750"/>
    <line x1="600" y1="520" x2="600" y2="750" stroke="#8c6a3e" stroke-dasharray="18 22" stroke-width="4" opacity="0.4"/>
  </g>

  <!-- Silueta -->
  <g fill="#050707">
    <ellipse cx="600" cy="736" rx="70" ry="9" opacity="0.5"/>
    <path d="M570 560 q30 -26 60 0 l22 176 h-28 l-10 -112 -4 112 h-40 l-6 -118 -16 118 h-26 z"/>
    <circle cx="600" cy="548" r="22"/>
  </g>

  <!-- Reflejos y lluvia -->
  <g stroke="#8fb8b3" stroke-width="1" opacity="0.25">
    <line x1="120" y1="600" x2="100" y2="660"/>
    <line x1="300" y1="560" x2="280" y2="620"/>
    <line x1="900" y1="590" x2="880" y2="650"/>
    <line x1="1060" y1="550" x2="1040" y2="610"/>
  </g>
  <rect width="1200" height="750" fill="#000" opacity="0.08"/>
</svg>
